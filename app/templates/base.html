<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NAS 媒体整理器{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">NAS 媒体整理器 <span>v0.1.4</span></a>
  <nav>
    <a href="/browse">媒体文件</a>
    <a href="/collections">已整理集合</a>
    <a href="/tasks">任务记录</a>
  </nav>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
<footer class="footer">媒体根目录：<code>{{ media_root }}</code> · 默认不覆盖任何已有文件</footer>
</body>
</html>
